  <script>
    (function () {
      const originalRAF = window.requestAnimationFrame;
      const originalCancelRAF = window.cancelAnimationFrame;

      window.fps = null;

      let rafIdCounter = 1e9;
      let callbacks = new Map();
      let frameScheduled = false;
      let nextFrameAt = 0;
      let lastSchedulerFps = Infinity;
      let renderedFrames = [];

      const MIN_ADAPTIVE_FPS = 10;
      const PROBE_MS = 500;
      const RECOVERY_GAP_MS = 800;
      const RECOVERY_HOLD_MS = 5000;
      let autoFps = 0;
      let gentleFirstDrop = true;
      let userFps = window.fps;
      let paceFps = 60;
      let paceReady = false;
      let frames = [];
      let prevFrameTime = 0;
      let lastCheck = 0;
      let lastProbeCheck = 0;
      let pressureStreak = 0;
      let pressureScore = 0;
      let calmSince = 0;
      let holdUntil = 0;
      let nextRecoveryAt = 0;
      let probeActive = false;
      let probeStart = 0;
      let probeTarget = 0;
      let probeBase = 0;
      let probeFails = 0;
      let guardGraceUntil = 0;
      let lastRequestAt = 0;
      let monitorRunning = false;

      window.__WEBGAL_FPS_GUARD__ = { level: 0, cap: 0, pace: 60, slow: 0, grace: 0, auto: 0 };

      function baseFps() {
        return typeof window.fps === 'number' && window.fps > 0 ? window.fps : Infinity;
      }

      function limitFps() {
        const base = baseFps();
        return autoFps > 0 ? Math.min(base, autoFps) : base;
      }

      function maxAdaptiveFps() {
        return Math.min(baseFps(), paceFps);
      }

      function currentEffectiveFps() {
        const fps = limitFps();
        return isFinite(fps) ? fps : paceFps;
      }

      function rampDownFps(current) {
        const target = Math.max(MIN_ADAPTIVE_FPS, Math.round(current * 0.95 * 10) / 10);
        return target < current - 0.5 ? target : 0;
      }

      function displayLevel() {
        if (!(autoFps > 0)) return 0;
        return Math.max(1, Math.min(6, Math.ceil(paceFps / autoFps) - 1));
      }

      function resetGuard() {
        autoFps = 0;
        gentleFirstDrop = true;
        probeActive = false;
        probeTarget = 0;
        probeBase = 0;
        probeStart = 0;
        probeFails = 0;
        lastProbeCheck = 0;
        nextRecoveryAt = 0;
        pressureStreak = 0;
        pressureScore = 0;
        calmSince = 0;
        holdUntil = 0;
        guardGraceUntil = 0;
        renderedFrames = [];
        nextFrameAt = 0;
        lastSchedulerFps = Infinity;
      }

      function syncUserFps() {
        if (window.fps !== userFps) {
          userFps = window.fps;
          resetGuard();
        }
      }

      function customRAF(callback) {
        syncUserFps();
        lastRequestAt = performance.now();
        ensureMonitor();

        const fps = limitFps();
        if (!isFinite(fps)) {
          return originalRAF(callback);
        }

        const id = ++rafIdCounter;
        callbacks.set(id, callback);
        scheduleFrame();
        return id;
      }

      function customCancelRAF(id) {
        if (callbacks.delete(id)) return;
        originalCancelRAF(id);
      }

      function scheduleFrame() {
        if (frameScheduled) return;
        frameScheduled = true;
        originalRAF(runFrame);
      }

      function runFrame(now) {
        frameScheduled = false;
        if (callbacks.size === 0) return;

        const fps = limitFps();
        if (isFinite(fps)) {
          const interval = 1000 / fps;
          if (!isFinite(lastSchedulerFps) || nextFrameAt === 0) {
            nextFrameAt = now;
          } else if (fps < lastSchedulerFps * 0.99) {
            nextFrameAt = now;
          }
          if (nextFrameAt - now > 0.5) {
            scheduleFrame();
            return;
          }
          if (nextFrameAt < now - Math.max(250, interval * 4)) {
            nextFrameAt = now;
          }
          nextFrameAt += interval;
        }
        lastSchedulerFps = fps;

        const batch = Array.from(callbacks.keys());
        let rendered = false;
        for (const id of batch) {
          const callback = callbacks.get(id);
          if (!callback) continue;
          callbacks.delete(id);
          rendered = true;
          try {
            callback(now);
          } catch (error) {
            setTimeout(() => {
              throw error;
            }, 0);
          }
        }
        if (rendered) {
          renderedFrames.push(now);
          if (renderedFrames.length > 900) renderedFrames.shift();
        }
        if (callbacks.size > 0) scheduleFrame();
      }

      window.requestAnimationFrame = customRAF;
      window.cancelAnimationFrame = customCancelRAF;

      function publishGuard(ratio) {
        const cap = limitFps();
        window.__WEBGAL_FPS_GUARD__.level = displayLevel();
        window.__WEBGAL_FPS_GUARD__.cap = isFinite(cap) ? Math.round(cap * 10) / 10 : 0;
        window.__WEBGAL_FPS_GUARD__.pace = Math.round(paceFps * 10) / 10;
        window.__WEBGAL_FPS_GUARD__.slow = Math.round((ratio || 0) * 100) / 100;
        window.__WEBGAL_FPS_GUARD__.grace = Math.max(0, Math.round(guardGraceUntil - performance.now()));
        window.__WEBGAL_FPS_GUARD__.auto = Math.round(autoFps * 10) / 10;
      }

      window.__WEBGAL_FPS_GUARD_RESET__ = (graceMs) => {
        resetGuard();
        frames = [];
        guardGraceUntil = performance.now() + Math.max(0, typeof graceMs === 'number' ? graceMs : 2000);
        publishGuard(0);
      };

      function startProbe(now) {
        if (probeActive || !(autoFps > 0)) return;
        const max = maxAdaptiveFps();
        if (autoFps >= max - 0.1) {
          autoFps = 0;
          return;
        }
        const target = Math.min(max, autoFps * 1.05);
        if (target <= autoFps + 0.05) {
          autoFps = 0;
          return;
        }
        probeBase = autoFps;
        probeTarget = target;
        autoFps = target;
        probeActive = true;
        probeStart = now;
        lastProbeCheck = now;
        calmSince = 0;
        publishGuard(0);
      }

      function succeedProbe(now) {
        probeActive = false;
        probeTarget = 0;
        probeFails = Math.max(0, probeFails - 1);
        nextRecoveryAt = now + RECOVERY_GAP_MS;
        if (autoFps >= maxAdaptiveFps() - 0.1) {
          autoFps = 0;
        }
        publishGuard(0);
      }

      function failProbe(now) {
        autoFps = probeBase;
        probeActive = false;
        probeTarget = 0;
        probeFails++;
        nextRecoveryAt = now + Math.min(180000, 30000 * probeFails);
        holdUntil = now + 3000;
        calmSince = 0;
        pressureStreak = 0;
        publishGuard(0);
      }

      function checkProbe(now) {
        if (!probeActive) return;
        const elapsed = now - probeStart;
        if (elapsed < 250) return;

        const list = frames.filter((frame) => frame.t >= probeStart && now - frame.t <= PROBE_MS);
        if (list.length < 10) {
          if (elapsed >= PROBE_MS + 250) failProbe(now);
          return;
        }

        const expected = Math.max(1000 / paceFps, 1000 / Math.max(1, probeTarget));
        const slowLimit = expected * 1.45;
        let slow = 0;
        for (const frame of list) {
          if (frame.d > slowLimit) slow++;
        }
        if (slow / list.length >= 0.25) {
          failProbe(now);
          return;
        }

        if (elapsed >= PROBE_MS) {
          const delivered = renderedFrames.filter((t) => t >= probeStart).length;
          const expectedFrames = probeTarget * (elapsed / 1000);
          if (delivered + 1 < expectedFrames * 0.97) {
            failProbe(now);
            return;
          }
          succeedProbe(now);
        }
      }

      function evaluate(now) {
        if (document.visibilityState !== 'visible') return;
        syncUserFps();

        if (now < guardGraceUntil) {
          frames = [];
          pressureStreak = 0;
          calmSince = 0;
          publishGuard(0);
          return;
        }

        frames = frames.filter((frame) => now - frame.t <= 2500);
        const count = frames.length;
        if (count < 24) return;

        const sorted = frames.map((frame) => frame.d).sort((a, b) => a - b);
        const fast = Math.max(4, sorted[Math.floor(count * 0.2)]);
        const cap = limitFps();
        const displayInterval = 1000 / paceFps;
        const slowLimit = Math.max(displayInterval, isFinite(cap) ? 1000 / cap : 0) * 1.45;
        let slow = 0;
        for (const frame of frames) {
          if (frame.d > slowLimit) slow++;
        }
        const ratio = slow / count;

        const measuredPace = Math.max(24, Math.min(240, 1000 / fast));
        // 屏幕节奏只升不降，避免压力把监控自身节流误当成刷新率变化
        paceFps = Math.max(paceFps, measuredPace);
        paceReady = true;

        if (probeActive) {
          publishGuard(ratio);
          return;
        }

        // 波动压力用衰减累计，避免两次评估之间回落就重置
        if (ratio >= 0.1) {
          pressureScore = Math.min(4, pressureScore + 1);
        } else if (ratio <= 0.04) {
          pressureScore = Math.max(0, pressureScore - 0.7);
        } else {
          pressureScore = Math.max(0, pressureScore - 0.4);
        }

        if (ratio >= 0.15 || pressureScore >= 2.2) {
          calmSince = 0;
          pressureStreak++;
          if (now >= holdUntil && (pressureScore >= 2.2 || ratio >= 0.45)) {
            const next = rampDownFps(currentEffectiveFps());
            if (next > 0) {
              autoFps = next;
              holdUntil = now + (gentleFirstDrop ? 5000 : 3000);
              gentleFirstDrop = false;
              pressureStreak = 0;
              pressureScore = 0;
              nextRecoveryAt = now + RECOVERY_HOLD_MS;
              probeFails = 0;
              publishGuard(ratio);
              return;
            }
          }
        } else if (ratio <= 0.04) {
          if (!calmSince) calmSince = now;
          if (autoFps > 0 && now >= nextRecoveryAt && now >= holdUntil) {
            const lastRendered = renderedFrames.length ? renderedFrames[renderedFrames.length - 1] : 0;
            if (now - lastRendered <= 1000) {
              startProbe(now);
            }
          }
        } else {
          calmSince = 0;
          pressureStreak = 0;
        }

        publishGuard(ratio);
      }

      function ensureMonitor() {
        if (!monitorRunning) {
          monitorRunning = true;
          originalRAF(monitor);
        }
      }

      function monitor(now) {
        monitorRunning = false;

        if (prevFrameTime) {
          const delta = now - prevFrameTime;
          if (delta >= 400) {
            frames = [];
          } else if (delta > 1) {
            frames.push({ t: now, d: delta });
          }
        }
        prevFrameTime = now;

        if (probeActive && now - lastProbeCheck >= 100) {
          lastProbeCheck = now;
          checkProbe(now);
        }

        if (now - lastCheck >= 1000) {
          lastCheck = now;
          evaluate(now);
        }

        if (probeActive || now - lastRequestAt <= 1500) {
          ensureMonitor();
        }
      }

      document.addEventListener('visibilitychange', () => {
        frames = [];
        prevFrameTime = 0;
        lastCheck = 0;
        pressureStreak = 0;
        pressureScore = 0;
        calmSince = 0;
        if (probeActive) {
          autoFps = probeBase;
          probeActive = false;
        }
      });
    })();
  </script>
  <script>
    const targetHeight = 1440;
    const targetWidth = 2560;
    /**
     * 在窗口大小改变时进行强制缩放
     */
    const ua = navigator.userAgent;
    const isIOSDevice = !!ua.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/);
    // B 站 Toy 内 iOS 与安卓一样自动旋转，不再提示横屏
    const useIOSLayout = isIOSDevice && window.__WEBGAL_BILIBILI_TOY__ !== true;
    if (useIOSLayout) {
      /**
       * iOS
       */
      alert(
        `iOS 用户请横屏使用以获得最佳体验
  | Please use landscape mode on iOS for the best experience
  | iOS ユーザーは横画面での使用をお勧めします`,
      );
    }
    function resize() {
      const h = window.innerHeight; // 窗口高度
      const w = window.innerWidth; // 窗口宽度
      const dpr = window.devicePixelRatio || 1;
      const snap = (value) => Math.round(value * dpr) / dpr;
      const zoomH = h / targetHeight; // 以窗口高度为基准的变换比
      const zoomW = w / targetWidth; // 以窗口宽度为基准的变换比
      const zoomH2 = w / targetHeight; // 竖屏时以窗口高度为基础的变换比
      const zoomW2 = h / targetWidth; // 竖屏时以窗口宽度为基础的变换比
      let ebgTransform = '';
      // 实际像素 / 设计像素
      let unit = 1;
      // #root / #Title_enter_page 的实际排版尺寸
      let rootW = targetWidth;
      let rootH = targetHeight;
      let rootLeft = 0;
      let rootTop = 0;
      let rootTransform = 'none';
      let rootTransformOrigin = '0 0';
      const root = document.getElementById('root'); // 获取根元素
      const title = document.getElementById('Title_enter_page');
      const ebg = document.getElementById('ebg');
      const elements = [root, title];
      if (w > h) {
        if (ebg) {
          ebg.style.height = `100vh`;
          ebg.style.width = `100vw`;
          ebg.style.flexDirection = `row`;
          ebgTransform = '';
          ebg.classList.remove('ebg-portrait');
        }
        // 横屏：等比铺满，另一边居中留边
        unit = w * (9 / 16) >= h ? zoomH : zoomW;
        rootW = snap(targetWidth * unit);
        rootH = snap(targetHeight * unit);
        rootLeft = snap((w - rootW) / 2);
        rootTop = snap((h - rootH) / 2);
        rootTransform = 'none';
        rootTransformOrigin = '0 0';
      } else {
        // 竖屏：设计宽高互换，绕中心旋转 90° 铺满
        if (ebg) {
          ebg.style.height = `100vh`;
          ebg.style.width = `100vw`;
          ebg.style.flexDirection = `column`;
          ebg.classList.add('ebg-portrait');
        }
        const zoom2 = h * (9 / 16) >= w ? zoomH2 : zoomW2;
        unit = zoom2;
        // 按旋转后的可视矩形取整居中
        rootW = snap(targetWidth * unit);
        rootH = snap(targetHeight * unit);
        if (Math.round((rootW - rootH) * dpr) % 2 !== 0) {
          rootH += 1 / dpr;
        }
        rootLeft = snap((w - rootH) / 2) - (rootW - rootH) / 2;
        rootTop = snap((h - rootW) / 2) + (rootW - rootH) / 2;
        rootTransform = 'rotate(90deg)';
        rootTransformOrigin = '50% 50%';
      }
      if (ebg) {
        ebg.style.transform = ebgTransform;
      }
      // 设计像素单位
      unit = rootW / targetWidth;
      document.documentElement.style.setProperty('--wg-u', `${unit}px`);
      document.documentElement.classList.toggle('wg-rotate', rootTransform !== 'none');
      for (const element of elements) {
        if (element) {
          element.style.position = 'absolute';
          element.style.transform = rootTransform;
          element.style.transformOrigin = rootTransformOrigin;
          element.style.left = `${rootLeft}px`;
          element.style.top = `${rootTop}px`;
          element.style.width = `${rootW}px`;
          element.style.height = `${rootH}px`;
        }
      }
      // 通知 Pixi 调整渲染分辨率
      window.__WEBGAL_STAGE_SCALE__ = unit;
      if (typeof window.__WEBGAL_APPLY_STAGE_SCALE__ === 'function') {
        window.__WEBGAL_APPLY_STAGE_SCALE__(unit);
      }
    }

    if (!useIOSLayout) {
      // 创建一个新的 meta 标签
      const meta = document.createElement('meta');
      meta.name = "viewport";
      meta.content = "width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no";
      // 将该标签添加到 head 中
      document.getElementsByTagName('head')[0].appendChild(meta);
      resize();
      window.onload = resize;
      window.onresize = resize;
      // 监听键盘 F11 事件，全屏时触发页面调整
      document.onkeydown = function (event) {
        const e = event;
        if (e && e.key === 'F11') {
          setTimeout(() => {
            resize();
          }, 100);
        }
      };
    } else {
      // ios
      const title = document.getElementById('Title_enter_page');
      const root = document.getElementById('root');
      const ebg = document.getElementById('ebg');
      function iosResize() {
        if (window.outerWidth / 16 > window.outerHeight / 9) {
          if (ebg) {
            ebg.style.flexDirection = `row`;
          }
        } else {
          if (ebg) {
            ebg.style.flexDirection = `column`;
          }
        }
        const meta = document.querySelector('meta[name="viewport"]');
        if (meta) {
          let scale = window.outerHeight / targetHeight
          if (window.outerWidth / targetWidth < window.outerHeight / targetHeight) {
            scale = window.outerWidth / targetWidth;
          }
          meta.setAttribute("content", "width=device-width, initial-scale=" + scale.toFixed(6) + ", minimum-scale=" + scale.toFixed(6) + ", maximum-scale=" + scale.toFixed(6));
        }
      }
      let scale = window.outerHeight / targetHeight
      if (window.outerWidth / targetWidth < window.outerHeight / targetHeight) {
        scale = window.outerWidth / targetWidth;
      }
      document.body.style.height = '130vh';
      document.body.style.overflowY = 'auto';
      const meta = document.createElement('meta');
      meta.name = "viewport";
      meta.content = "width=device-width, initial-scale=" + scale.toFixed(6) + ", minimum-scale=" + scale.toFixed(6) + ", maximum-scale=" + scale.toFixed(6);
      document.getElementsByTagName('head')[0].appendChild(meta);
      const style = document.createElement('style');
      style.type = 'text/css';
      style.textContent = '* { font-synthesis: none !important; }';
      document.head.appendChild(style);
      if (ebg) {
        ebg.style.height = '130vh';
      }
      if (title) {
        title.style.position = "absolute";
        title.style.left = "50%";
        title.style.marginLeft = "-" + (targetWidth / 2) + "px";
        title.style.top = "50%";
        title.style.marginTop = "calc(-" + (targetHeight / 2) + "px + 15vh)";
      }
      if (root) {
        root.style.position = "absolute";
        root.style.left = "50%";
        root.style.marginLeft = "-" + (targetWidth / 2) + "px";
        root.style.top = "50%";
        root.style.marginTop = "calc(-" + (targetHeight / 2) + "px + 15vh)";
      }
      window.onload = iosResize;
      window.onresize = iosResize;
    }
  </script>

  <script>

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = () => resolve(`Loaded: ${url}`);
        script.onerror = (error) => reject(`Failed to load: ${url}`);
        document.head.appendChild(script);
      });
    }

  <script>
    // useIOSLayout 复用上方 resize 脚本块的判断：
    // B 站 Toy 内 iOS 与安卓一样旋转，落地页按普通设备处理
    let enterPromise = new Promise(res => window.enterPromise = res);
    let renderPromise = new Promise(res => window.renderPromise = res);
    let enterReady = false;
    let appReady = false;
    let enterPending = false;
    renderPromise.then(() => {
      enterReady = true;
      tryEnterLanding();
    });
    window.addEventListener("webgal-app-ready", () => {
      appReady = true;
      tryEnterLanding();
    });
    /**
     * 将播放bgm的事件发送出去
     */
    Promise.all([enterPromise, renderPromise]).then(() => {
      const event = new MouseEvent("click", {
        "view": window,
        "bubbles": true,
        "cancelable": true
      });
      const target = document.getElementById("enter_game_target");
      if (target) {
        target.dispatchEvent(event);
      }
      if (event) {
        const logo = document.getElementById("logo_target");
        if (logo) {
          logo.style.display = "contents";
        }
      }
    });

    function jump(event, url) {
      // 获取点击事件，阻止点击事件冒泡触发 `enter` 事件
      event.stopPropagation();
      // window.location = url;
    }

    /**
     * 点击屏幕，进入引擎主界面
     */
    function enter() {
      if (typeof window.enterPromise !== 'function') return;
      enterPending = true;
      tryEnterLanding();
    }

    function tryEnterLanding() {
      if (!enterPending || !enterReady || !appReady) return;
      enterPending = false;
      const bgContainer = document.getElementById("Title_bg_container");
      if (bgContainer) {
        bgContainer.style.opacity = "0"; // 调整标题背景的透明度
      }
      const enterText = document.getElementById("Title_enter_text");
      if (enterText) {
        enterText.style.opacity = "0"; // 调整标题文字的透明度
      }
      const title = document.getElementById("Title_enter_page");
      const ebgLandingMask = document.getElementById("ebg_landing_mask");
      // 遮罩不再响应点击
      if (ebgLandingMask) {
        ebgLandingMask.style.pointerEvents = "none";
      }
      setTimeout(() => {
        if (title)
          title.style.opacity = "0";
        // 遮罩一起淡出
        if (ebgLandingMask)
          ebgLandingMask.style.opacity = "0";
      }, 500); //500ms后开始降低落地页透明度
      if (!useIOSLayout && title) {
        title.style.pointerEvents = "none"; //落地页不再响应点击
      }
      setTimeout(() => {
        if (title) {
          title.style.display = "none";
        }
        if (ebgLandingMask) {
          ebgLandingMask.style.display = "none";
        }
      }, 2000); // 将落地页设置为不显示
      window.enterPromise();
      delete window.enterPromise;
    }

    /**
     * 手柄适配：在落地页按任意按键进入游戏
     */
    (function () {
      let isEntering = false;
      function pollGamepad() {
        if (isEntering) return;
        const gamepads = navigator.getGamepads();
        for (const gp of gamepads) {
          if (gp) {
            for (const button of gp.buttons) {
              if (button.pressed) {
                const title = document.getElementById("Title_enter_page");
                if (title && title.style.display !== "none") {
                  isEntering = true;
                  enter();
                }
                return;
              }
            }
          }
        }
        requestAnimationFrame(pollGamepad);
      }
      window.addEventListener("gamepadconnected", pollGamepad);
      // 如果已经连接了手柄，直接开始轮询
      setTimeout(() => {
        const gps = navigator.getGamepads();
        for (const gp of gps) {
          if (gp) {
            pollGamepad();
            break;
          }
        }
      }, 500);
    })();
  </script>
